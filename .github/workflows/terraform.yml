name: Terraform

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run against main
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: mist-terraform-local-state
  cancel-in-progress: false

jobs:
  trusted-source:
    name: Trusted PR source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate workflow source
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Fork pull requests cannot run on the self-hosted Terraform runner."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual Terraform operations must run from main."
            exit 1
          fi

  terraform:
    name: Terraform
    needs: trusted-source
    if: needs.trusted-source.result == 'success'
    runs-on: [self-hosted, mist-terraform-demo]
    timeout-minutes: 30
    environment: mist-production

    env:
      MIST_API_TOKEN: ${{ secrets.MIST_APITOKEN }}
      MIST_HOST: ${{ vars.MIST_HOST }}
      TF_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'plan' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Select persistent local state
        shell: bash
        run: |
          state_root="${TF_STATE_DIR:-$HOME/.local/state/mist-terraform-demo}"
          state_dir="${state_root}/${GITHUB_REPOSITORY//\//-}"
          mkdir -p "$state_dir"
          chmod 700 "$state_dir"
          echo "TF_STATE_PATH=$state_dir/terraform.tfstate" >> "$GITHUB_ENV"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly -backend-config="path=${TF_STATE_PATH}"

      - name: Validate configuration
        run: terraform validate

      - name: Plan
        shell: bash
        run: |
          umask 077
          plan_args=()
          if [[ "$TF_OPERATION" == "destroy" ]]; then
            plan_args+=("-destroy")
          fi

          terraform plan "${plan_args[@]}" -no-color -lock-timeout=5m -out="$RUNNER_TEMP/mist.tfplan" | tee plan.txt
          {
            echo "## Terraform ${TF_OPERATION} plan"
            echo
            echo '```text'
            sed -n '1,500p' plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Back up state
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'plan'
        shell: bash
        run: |
          umask 077
          if [[ -f "$TF_STATE_PATH" ]]; then
            cp "$TF_STATE_PATH" "${TF_STATE_PATH}.$(date -u +%Y%m%dT%H%M%SZ).backup"
          fi

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.operation != 'plan'
        run: |
          umask 077
          terraform apply -no-color -lock-timeout=5m -auto-approve "$RUNNER_TEMP/mist.tfplan"

      - name: Protect state files
        if: always()
        shell: bash
        run: |
          if [[ -n "${TF_STATE_PATH:-}" && -d "$(dirname "$TF_STATE_PATH")" ]]; then
            find "$(dirname "$TF_STATE_PATH")" -maxdepth 1 -type f -exec chmod 600 {} +
          fi
